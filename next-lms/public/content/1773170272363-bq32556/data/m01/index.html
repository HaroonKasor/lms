  <style>
    
    html, body { 
	margin:0; height:100%; 
	overflow:hidden; ห
	}

    
    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .video-container {
      width: min(100vw, 100vh * 16 / 9);
      aspect-ratio: 16 / 9;
      position: relative;
    }
    .video-container iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: 0;
    }
  </style>
</head>
  <body>
    <!-- 1. The <iframe> (and video player) will replace this <div> tag. -->
    <div class="video-container"><div id="player" ></div></div>

    <script>
      // 2. This code loads the IFrame Player API code asynchronously.
      var tag = document.createElement('script');

      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      // 3. This function creates an <iframe> (and YouTube player)
      //    after the API code downloads.
      var player;
      function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
          height: '100%',
    	  width: '100%',
    	  videoId: videoid,
          playerVars: {
            'playsinline': 1
          },
          events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange
          }
        });
      }

      // 4. The API will call this function when the video player is ready.
      function onPlayerReady(event) {
        event.target.playVideo();
      }

      // 5. The API calls this function when the player's state changes.
      //    The function indicates that when playing a video (state=1),
      //    the player should play for six seconds and then stop.
      var done = false;
      function onPlayerStateChange(event) {
        if (event.data == YT.PlayerState.ENDED && !done) {
          done = true;
		  parent.setContentStatusPassed();
		  parent.sendExperiencedStatement
        }
      }
	  function updateYTSize(){
			var fullscreenW = 0;
			var fullscreenH = 0;
				if(DetectIpad()){
					fullscreenW = window.innerWidth;
					fullscreenH = window.innerHeight;
				}
				else{
					fullscreenW = $(window).width()-4;
					fullscreenH = $(window).height()-4;
				}
				/*if(fullscreenW < fixwidth+50){
					if(fullscreenW > 320){
						ytwidth = 320;
						ytheight = 180;
					}
					else{
						ytwidth = 240;
						ytheight = 140;
					}
				}
				else{
					ytwidth = 640;
					ytheight = 360;
				}*/
			ytwidth = fullscreenW;
			ytheight = fullscreenH;
			if(player != null){
				player.setSize(ytwidth, ytheight);
				player.setPlaybackQuality('hd1080');
				
			}
		}
      function stopVideo() {
        player.stopVideo();
      }
    </script>
