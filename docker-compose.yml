services:
  db:
    image: mysql:8.4
    container_name: lms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lms_enterprise}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./next-lms
      dockerfile: Dockerfile
    container_name: lms-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://goskillup.me}
      APP_URL: ${APP_URL:-https://goskillup.me}
      NEXT_PUBLIC_XAPI_OBJECT_BASE_URL: ${NEXT_PUBLIC_XAPI_OBJECT_BASE_URL:-https://goskillup.me}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      APP_NAME: ${APP_NAME:-SkillUp}
      CRON_SECRET: ${CRON_SECRET:-}
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      RESEND_BASE_URL: ${RESEND_BASE_URL:-https://api.resend.com}
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-root}@db:3306/${MYSQL_DATABASE:-lms_enterprise}
    volumes:
      - ./next-lms/data:/app/data
      - ./next-lms/public/content:/app/public/content
      - ./next-lms/public/uploads/courses:/app/public/uploads/courses
    ports:
      - "${APP_PORT:-8080}:3000"

  cron-reminder:
    image: curlimages/curl:8.8.0
    container_name: lms-cron-reminder
    restart: unless-stopped
    depends_on:
      - web
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      ENROLLMENT_REMINDER_CRON_INTERVAL_SECONDS: ${ENROLLMENT_REMINDER_CRON_INTERVAL_SECONDS:-3600}
    command: >
      sh -c 'while true; do
        if [ -n "$$CRON_SECRET" ]; then
          curl -fsS -H "Authorization: Bearer $$CRON_SECRET" "http://web:3000/api/cron/enrollment-expiry-reminders" || true;
        fi;
        sleep "$${ENROLLMENT_REMINDER_CRON_INTERVAL_SECONDS:-3600}";
      done'

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: lms-phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      # Use cookie auth so phpMyAdmin always shows the login form.
      PMA_AUTH_TYPE: cookie
    ports:
      - "${PHPMYADMIN_PORT:-8083}:80"

volumes:
  mysql_data:
